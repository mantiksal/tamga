<!--
  TEK DOSYA, KENDİ KENDİNE DÖNEN. Sitede iki ayrı dosya var ve orası doğru:
  site kendi tema anahtarını taşıyor, `.dark` sınıfıyla seçim yapılıyor.
  Burası farklı — bu dosya README, npm ve depo gibi tema anahtarı OLMAYAN
  yerlerde kullanılıyor, ve oralarda tek referans işletim sisteminin şeması.

  `<img>` içindeki bir SVG'ye sayfanın CSS değişkenleri geçmez, ama dosyanın
  KENDİ `prefers-color-scheme` kuralı çalışır. `<picture>` + `<source>` ile
  aynı işi yapmayı denemek npm'in HTML süzgecine bağımlı olmak demekti; tek
  dosya o bağımlılığı kaldırıyor.

  Koyu şemadaki değerler `tamga-dark.svg`in paletinden: kelime işareti ve dış
  halka beyaz, iç halka açık mavi, merkez lacivert.
-->
<style>
  .yazi   { fill: #0A1F3D }
  .dis    { fill: #1E4FD8 }
  .merkez { fill: #0A1F3D }
  @media (prefers-color-scheme: dark) {
    .yazi { fill: #FFFFFF }
    .dis  { fill: #FFFFFF }
  }
</style>
