name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mantiksal/tamga-docs
  SITE_URL: https://tamga.org.tr

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, tamga-deploy]
    steps:
      - name: kubectl kurulumu
        run: |
          if command -v kubectl >/dev/null 2>&1; then exit 0; fi
          BIN="${RUNNER_TEMP:-/tmp}/bin"
          mkdir -p "$BIN"
          V=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
          curl -fsSLo "$BIN/kubectl" "https://dl.k8s.io/release/$V/bin/linux/amd64/kubectl"
          chmod +x "$BIN/kubectl"
          echo "$BIN" >> "$GITHUB_PATH"

      - name: imaji guncelle
        run: kubectl -n tamga set image deployment/tamga-docs app=${{ env.IMAGE }}:${{ github.sha }}

      - name: rollout
        run: kubectl -n tamga rollout status deployment/tamga-docs --timeout=300s
