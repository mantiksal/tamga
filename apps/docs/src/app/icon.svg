<!--
  Tamga amblemi, sekme ikonu olarak.

  TEMAYA GÖRE DIŞ HALKA DEĞİŞİYOR, ve renkler uydurulmadı: koyu şemadaki
  değerler `tamga-dark.svg`in kendi paletinden alındı: dış halka beyaz, iç
  halka açık mavi, merkez lacivert. Yani sekme ikonu koyu temada logonun
  aynısını gösteriyor.

  NEDEN SADECE DIŞ HALKA: iç halkanın açık mavisi her iki şeritte de görünür,
  merkezin laciverti ise koyu şeritte tek başına kaybolurdu, ama kaybolmuyor,
  çünkü etrafı açık mavi. Koyu bir merkez, açık bir alanın içinde duruyor;
  sayfanın zemininde değil.

  `prefers-color-scheme` TARAYICININ ŞERİDİNİ İZLİYOR, sayfanın temasını
  değil. Doğrusu bu: ikon sayfanın içinde değil, sekmede yaşıyor.

  SVG favicon'u desteklemeyen tarayıcı `icon.png`e düşer; o dosya şeffaf ve
  tek renkli değil, yani orada tema ayrımı yok. Kabul edilen bir eksik:
  açık halkanın mavisi iki şeritte de okunuyor.
-->
<style>
  .dis { fill: #1E4FD8 }
  @media (prefers-color-scheme: dark) { .dis { fill: #FFFFFF } }
</style>
